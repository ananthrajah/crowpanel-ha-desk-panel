# ═════════════════════════════════════════════════════════════════════════════
# Desk Panel - Elecrow CrowPanel 7" Basic V3.0 (DIS08070H, ESP32-S3 N4R8)
# VERSION: 3.2.0   (2026-10-20)
# Pairs with HA package: desk_panel.yaml v3.0.0 or newer  ·  desktop app v0.2.0+
# Built & compile-tested against ESPHome 2026.9.1
#
# CHANGELOG
#   3.2.0  2026-10-20  Home page: clock + date, temperature, now-playing strip (tap for
#                      Music), up to 8 favourite buttons and shortcuts to every page.
#                      Bottom bar gets a Home button (hidden on the home page). Any page
#                      except Music returns to home after N seconds without a touch
#                      (set in the desktop app; 0 = never). Sleep also returns home.
#                      Needs HA package 3.1.0 and desktop app 0.3.0 for favourites,
#                      timeout and temperature (defaults: none, 30 s, hidden).
#   3.1.2  2026-10-19  Touch start-up: checks the touch chip actually answers after the
#                      reset and retries the reset up to 3 times (longer waits). Logs what
#                      it finds on the touch bus (visible in HA's log) so a loose touch
#                      ribbon can be told apart from a software problem.
#                      Bottom bar: page buttons with no page set up in the desktop app
#                      are now blank and can't be tapped (were "Page 3" / "Page 4").
#   3.1.1  2026-10-19  Fix: album-art downloads froze the panel (touch + HA updates) for up
#                      to 20 s. Art is now fetched only when the picture really changes
#                      (not on every reconnect), never while the screen is asleep (it
#                      catches up on wake), and HTTP gives up after 5 s instead of 10 s.
#   3.1.0  2026-10-18  Volume knob (KY-040 on the UART port: CLK->IO44, DT->IO43, +->3V3,
#                      GND). Turn = volume +/-2 % per click (sent 150 ms after you stop,
#                      so fast turns don't flood HA); turning also wakes the screen.
#                      USB serial logging is off (those pins are the knob now) - use
#                      Wi-Fi logs. Unplug the knob before flashing over USB; OTA is fine.
#                      Knob press (SW->IO38 on GPIO_D) is ready below, commented out.
#   3.0.1  2026-10-18  "Panel config version" now shows in HA (was "unknown").
#                      Speakers are set once in substitutions (speaker_1..4).
#   3.0.0  2026-10-17  Pages 1-4 are now laid out from the Desk Panel desktop app (via
#                      HA): 12 buttons each (4x3), names/labels/entities change live with
#                      no reflash. Fixed Office/Home pages removed. Bottom bar is now
#                      8 buttons with the page names. Needs HA package 3.0.0 and
#                      desk_layout.h. Buttons call script.desk_panel_tap (toggle/run).
#   2.2.0  2026-10-17  Music page: speaker dropdown (pick directly instead of cycling)
#                      and Spotify / YouTube source buttons (sets what Play and the
#                      Library tab use).
#   2.1.2  2026-10-17  Switch tiles always match HA: repainted on boot/reconnect,
#                      on wake from sleep, every 5 s, and 1.5 s after each tap
#                      (so a failed toggle snaps back instead of showing wrong).
#   2.1.1  2026-10-17  Office page: + Kids Room light (Meross).
#   2.1.0  2026-10-17  Office page: Meross switches only (Mancave 1, Mancave 2,
#                      Monitor, + Guest Room). Play button now starts music when
#                      the player's queue is empty (needs HA package 2.1.0).
#   2.0.2  2026-10-17  Silence harmless snprintf truncation warnings in the
#                      progress-time labels (bigger buffer, no negative values).
#   2.0.1  2026-10-17  Fix: Wi-Fi failed to start (out of internal RAM) after the
#                      v2.0.0 feature additions. PSRAM malloc enabled, Wi-Fi/LWIP
#                      buffers in PSRAM, 64 KB data cache reverted. Heap sensors added.
#   2.0.0  2026-10-17  Versioning (shows in HA device info + on-screen).
#                      Pages: Office, Main Floor, Music, Library, Speakers, Climate.
#                      Music: progress bar + seek, elapsed/remaining, repeat, shuffle,
#                        "Track radio" / "Artist radio" (Music Assistant radio mode).
#                      Library: browse Spotify / YouTube Music / Mixes playlists live
#                        from Music Assistant, tap to play.
#                      Speakers: join/unjoin speakers into a group + per-speaker volume.
#                      Climate: thermostat page (placeholder entity until Nest is in HA).
#                      Screen sleeps after 10 min (adjustable from HA), wakes on touch.
#   1.3.0  2026-10-16  Black theme (no dark-grey fills -> no shimmer), faster touch
#                      polling, 400 kHz I2C, 64 KB data cache, diagnostics removed.
#   1.2.0  2026-10-16  V3.0 touch fixes: logger on UART0, GPIO19/20 reset at boot,
#                      Elecrow PCA9557 touch reset sequence.
#   1.0.0  2026-10-15  First version: Home + Music pages.
#
# Project page: https://github.com/ananthrajah/crowpanel-ha-desk-panel
# Files needed in /config/esphome/: this file, usb_disable.h, desk_layout.h
# HA side: /config/packages/desk_panel.yaml, and "Allow the device to perform
# Home Assistant actions" enabled on this device in the ESPHome integration.
# ═════════════════════════════════════════════════════════════════════════════

substitutions:
  version: "3.2.0"
  name: crowpanel-desk
  friendly_name: Desk Panel
  now_playing: sensor.desk_panel_now_playing
  playlists: sensor.desk_panel_playlists
  # Thermostat - PLACEHOLDER. Replace once your Google/Nest thermostat is in HA
  # (Matter pairing from the Google Home app, or the Google Nest integration).
  thermostat: climate.home_thermostat
  temp_step: "0.5"
  # Layout of pages 1-4 comes from HA (edited in the Desk Panel desktop app)
  layout: sensor.desk_panel_layout
  # ── CHANGE THESE: your speakers (Music Assistant media_player entities) ──
  # Same 4 entities, same order, as input_select.desk_panel_player in the HA package.
  # Music tab dropdown = all 4. Speakers tab (group + volume) = 1, 2 and 4
  # (3 is meant for an existing Music Assistant group / sync group).
  speaker_1: media_player.living_room
  speaker_1_name: "Living Room"
  speaker_2: media_player.office
  speaker_2_name: "Office"
  speaker_3: media_player.whole_house
  speaker_3_name: "Whole house (group)"
  speaker_4: media_player.kitchen
  speaker_4_name: "Kitchen"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: "ananthrajah.crowpanel_desk_panel"
    version: "${version}"
  platformio_options:
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  includes:
    - usb_disable.h
    - desk_layout.h
  on_boot:
    # Before the I2C bus starts (bus = 1000): give GPIO19/20 back to plain GPIO.
    - priority: 1001
      then:
        - lambda: |-
            gpio_reset_pin(GPIO_NUM_19);
            gpio_reset_pin(GPIO_NUM_20);
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_38, 0);
            delay(50);
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_INPUT);
            delay(100);
    # Start on page 1 with its bottom-bar button highlighted
    - priority: -100
      then:
        - script.execute: { id: set_nav, idx: 8 }
        - script.execute: clock_update
        - text_sensor.template.publish: { id: cfg_version, state: "${version}" }
    # Elecrow V3.0 touch reset via PCA9557 (0x18): IO0 = GT911 RST, IO1 = GT911 INT.
    # Priority 800 = after the I2C bus, before the touchscreen (600).
    - priority: 800
      then:
        - lambda: |-
            // Elecrow V3.0: GT911 RST = PCA9557 IO0, INT = IO1. INT low during reset -> 0x5D.
            auto *bus = id(touch_i2c);
            const uint8_t out_low[2]  = {0x01, 0x00};
            const uint8_t cfg_out[2]  = {0x03, 0xFC};
            const uint8_t rst_high[2] = {0x01, 0x01};
            const uint8_t int_in[2]   = {0x03, 0xFE};
            uint8_t b = 0;
            for (int attempt = 1; attempt <= 3; attempt++) {
              auto e1 = bus->write(0x18, out_low, 2);
              bus->write(0x18, cfg_out, 2);
              delay(20 * attempt);
              bus->write(0x18, rst_high, 2);
              delay(10 * attempt);
              bus->write(0x18, int_in, 2);
              delay(100 * attempt);
              bool at5d = bus->read(0x5D, &b, 1) == i2c::ERROR_OK;
              bool at14 = bus->read(0x14, &b, 1) == i2c::ERROR_OK;
              ESP_LOGW("touch_diag", "attempt %d: expander 0x18 %s, touch 0x5D %s, touch 0x14 %s",
                       attempt, e1 == i2c::ERROR_OK ? "OK" : "NO ANSWER",
                       at5d ? "OK" : "no answer", at14 ? "ANSWERS (wrong address)" : "no answer");
              char buf[96];
              snprintf(buf, sizeof(buf), "%s (attempt %d; expander %s)",
                       at5d ? "Touch chip OK" : (at14 ? "Touch chip on WRONG address 0x14" : "Touch chip NOT answering"),
                       attempt, e1 == i2c::ERROR_OK ? "OK" : "not answering");
              id(touch_diag) = buf;
              if (at5d) break;
            }

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
    sdkconfig_options:
      # v2.0.1: internal RAM was running out before Wi-Fi started (ESP_ERR_NO_MEM).
      # Let ordinary allocations use PSRAM (keep small ones + a reserve internal),
      # put Wi-Fi/LWIP buffers in PSRAM when possible, and give back the 32 KB
      # that the 64 KB data cache was taking from internal RAM.
      CONFIG_SPIRAM_USE_CAPS_ALLOC: n
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "2048"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "49152"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0  # REQUIRED on this board (USB-JTAG default breaks the touch I2C bus)
  baud_rate: 0          # 3.1.0: no serial logs - IO43/IO44 are the volume knob (logs still work over Wi-Fi)

api:
  encryption:
    key: !secret desk_panel_api_key
  # After a reboot / reconnect HA re-sends every state; repaint once they've arrived.
  on_client_connected:
    - delay: 3s
    - script.execute: sync_dyn

ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "DeskPanel-Fallback"

captive_portal:

http_request:
  verify_ssl: false
  timeout: 5s       # 3.1.1: was 10 s - a slow album-art fetch blocks the whole panel

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: clock_update
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_update

# Memory health (shows in HA under the device's diagnostic entities)
debug:
  update_interval: 60s

globals:
  - id: home_timeout_s  # 3.2.0: seconds without a touch before returning home (0 = never)
    type: int
    initial_value: '30'
  - id: cur_nav         # 3.2.0: 0-3 pages, 4 music, 5 library, 6 speakers, 7 climate, 8 home
    type: int
    initial_value: '8'
  - id: touch_diag    # 3.1.2: result of the touch-chip check at boot (shown in HA)
    type: std::string
    initial_value: '"not checked"'
  - id: art_url       # 3.1.1: last album-art URL fetched (skip repeats)
    type: std::string
    initial_value: '""'
  - id: art_pending   # 3.1.1: picture changed while the screen was asleep
    type: bool
    initial_value: 'false'
  - id: knob_vol      # volume target while the knob is turning (-1 = take it from HA)
    type: int
    initial_value: '-1'
  - id: np_pos        # media_position (s) at np_ts
    type: float
    initial_value: '0'
  - id: np_dur        # media_duration (s)
    type: float
    initial_value: '0'
  - id: np_ts         # unix time media_position was reported
    type: float
    initial_value: '0'
  - id: np_now_pos    # computed live position (s)
    type: float
    initial_value: '0'
  - id: seeking       # true while the user drags the progress slider
    type: bool
    initial_value: 'false'

# ───────────── Display / touch / backlight ─────────────
i2c:
  - id: touch_i2c
    sda: 19
    scl: 20
    scan: true
    frequency: 400kHz

display:
  - platform: mipi_rgb
    model: RPI
    id: my_display
    invert_colors: true
    dimensions:
      width: 800
      height: 480
    de_pin: 41
    hsync_pin: 39
    vsync_pin: 40
    pclk_pin: 0
    pclk_frequency: 15MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 13
    vsync_front_porch: 1
    vsync_pulse_width: 31
    vsync_back_porch: 13
    data_pins:
      red: [14, 21, 47, 48, 45]
      green: [9, 46, 3, 8, 16, 1]
      blue: [15, 7, 6, 5, 4]
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: touch_i2c
    address: 0x5D
    display: my_display
    update_interval: 20ms
    calibration:
      x_min: 0
      x_max: 800
      y_min: 0
      y_max: 480
    # Wake from sleep on any touch. While LVGL is paused it ignores input, so the
    # waking tap never presses a button underneath.
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - script.execute: sync_dyn
            - lvgl.widget.redraw:
            - light.turn_on: backlight
            - script.execute: art_refresh
      - script.execute: home_timer

output:
  - platform: ledc
    pin: 2
    id: backlight_pwm
    frequency: 1220Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# Screen timeout, adjustable from HA (Settings > Devices > Desk Panel)
number:
  - platform: template
    name: "Screen timeout"
    id: screen_timeout
    icon: mdi:timer-sand
    unit_of_measurement: min
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    entity_category: config

button:
  - platform: restart
    name: "Restart"
    entity_category: config
  - platform: template
    name: "Refresh playlists"
    icon: mdi:playlist-music
    on_press:
      - homeassistant.event:
          event: esphome.desk_panel_refresh_playlists

# ───────────── Album art ─────────────
image:
  - platform: online_image
    id: album_art
    url: "http://127.0.0.1/placeholder.jpg"
    format: JPEG
    type: RGB565
    resize: 260x260
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: art_img
          src: album_art
      - lvgl.widget.show: art_img
      - lvgl.image.update:
          id: home_art
          src: album_art
      - lvgl.widget.show: home_art
    on_error:
      - lvgl.widget.hide: art_img
      - lvgl.widget.hide: home_art

# ───────────── Data from Home Assistant ─────────────
text_sensor:
  # 3.1.2 diagnostics: what the touch-chip check found at boot
  - platform: template
    name: "Touch status at boot"
    icon: mdi:gesture-tap
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return id(touch_diag);'
  - platform: debug
    reset_reason:
      name: "Reset reason"
  - platform: version
    name: "ESPHome version"
    hide_timestamp: true
  - platform: template
    name: "Panel config version"
    id: cfg_version
    icon: mdi:tag
    entity_category: diagnostic
    update_interval: never
    lambda: 'return {"${version}"};'

  # Now playing
  - platform: homeassistant
    id: np_state
    entity_id: ${now_playing}
    on_value:
      - lvgl.label.update:
          id: home_play_icon
          text: !lambda |-
            std::string s = (x == "playing") ? "" : "";
            return s;
      - lvgl.label.update:
          id: play_icon
          text: !lambda |-
            std::string s = (x == "playing") ? "" : "";
            return s;
  - platform: homeassistant
    id: np_player
    entity_id: ${now_playing}
    attribute: player
    on_value:
      - lvgl.dropdown.update:
          id: player_dd
          selected_index: !lambda |-
            static const char *const ents[] = {"${speaker_1}", "${speaker_2}", "${speaker_3}", "${speaker_4}"};
            for (int i = 0; i < 4; i++) if (x == ents[i]) return i;
            return 0;
  - platform: homeassistant
    id: np_player_name
    entity_id: ${now_playing}
    attribute: player_name
    on_value:
      - lvgl.label.update:
          id: spk_main_lbl
          text: !lambda |-
            std::string s = "Main speaker: " + x + "   (pick it on the Music page)";
            return s;
  - platform: homeassistant
    id: np_title
    entity_id: ${now_playing}
    attribute: title
    on_value:
      - lvgl.label.update:
          id: title_lbl
          text: !lambda |-
            std::string s = x.empty() ? std::string("Nothing playing") : x;
            return s;
      - lvgl.label.update:
          id: home_title
          text: !lambda |-
            std::string s = x.empty() ? std::string("Nothing playing") : x;
            return s;
  - platform: homeassistant
    id: np_artist
    entity_id: ${now_playing}
    attribute: artist
    on_value:
      - lvgl.label.update:
          id: artist_lbl
          text: !lambda |-
            std::string s = x;
            return s;
      - lvgl.label.update:
          id: home_artist
          text: !lambda |-
            std::string s = x;
            return s;
  - platform: homeassistant
    id: np_shuffle
    entity_id: ${now_playing}
    attribute: shuffle
    on_value:
      - lvgl.widget.update:
          id: shuffle_btn
          state:
            checked: !lambda 'return x == "True" || x == "true";'
  - platform: homeassistant
    id: np_repeat
    entity_id: ${now_playing}
    attribute: repeat
    on_value:
      - lvgl.widget.update:
          id: repeat_btn
          state:
            checked: !lambda 'return x == "all" || x == "one";'
      - lvgl.label.update:
          id: repeat_lbl
          text: !lambda |-
            std::string s = (x == "one") ? " 1" : "";
            return s;
  - platform: homeassistant
    id: np_members
    entity_id: ${now_playing}
    attribute: members
    on_value:
      - lvgl.widget.update:
          id: grp_sp1
          state:
            checked: !lambda 'return x.find("${speaker_1}") != std::string::npos;'
      - lvgl.widget.update:
          id: grp_sp2
          state:
            checked: !lambda 'return x.find("${speaker_2}") != std::string::npos;'
      - lvgl.widget.update:
          id: grp_sp3
          state:
            checked: !lambda 'return x.find("${speaker_4}") != std::string::npos;'
  - platform: homeassistant
    id: np_picture
    entity_id: ${now_playing}
    attribute: picture
    on_value:
      - if:
          condition:
            lambda: 'return x.empty();'
          then:
            - lambda: 'id(art_url) = ""; id(art_pending) = false;'
            - lvgl.widget.hide: art_img
            - lvgl.widget.hide: home_art
          else:
            - if:
                condition:
                  lambda: 'return x != id(art_url);'
                then:
                  - lambda: 'id(art_url) = x; id(art_pending) = true;'
                  - script.execute: art_refresh

  # Playlist library
  - platform: homeassistant
    id: pl_names
    entity_id: ${playlists}
    attribute: names
    on_value:
      - lambda: |-
          std::string opts = x.empty() ? std::string("(no playlists - tap Refresh)") : x;
          lv_roller_set_options(id(pl_roller)->obj, opts.c_str(), LV_ROLLER_MODE_NORMAL);
  - platform: homeassistant
    id: pl_source
    entity_id: input_select.desk_panel_source
    on_value:
      - script.execute: sync_source
      - lvgl.label.update:
          id: src_lbl
          text: !lambda |-
            std::string s = "Source: " + x + "  ";
            return s;

  # 3.2.0 home page: favourites + temperature (from the desktop app, via HA)
  - platform: homeassistant
    id: home_labels
    entity_id: ${layout}
    attribute: home_labels
    on_value:
      - script.execute: sync_dyn
  - platform: homeassistant
    id: home_ents
    entity_id: ${layout}
    attribute: home_entities
    on_value:
      - script.execute: sync_dyn
  - platform: homeassistant
    id: home_states
    entity_id: ${layout}
    attribute: home_states
    on_value:
      - script.execute: sync_dyn
  - platform: homeassistant
    id: home_temp_txt
    entity_id: ${layout}
    attribute: home_temp
    on_value:
      - lvgl.label.update:
          id: home_temp
          text: !lambda 'return x;'
  - platform: homeassistant
    id: home_temp_name_txt
    entity_id: ${layout}
    attribute: home_temp_name
    on_value:
      - lvgl.label.update:
          id: home_temp_name
          text: !lambda 'return x;'

  # Pages 1-4 layout (from the desktop app, via HA)
  - platform: homeassistant
    id: dp1_name
    entity_id: ${layout}
    attribute: p1_name
    on_value:
      - lvgl.label.update:
          id: dp1_title
          text: !lambda |-
            std::string s = x.empty() ? std::string("Page 1") : x;
            return s;
      # Bottom bar: blank + not tappable when this page isn't set up in the app
      - lambda: |-
          lv_label_set_text(id(navl_0), x.c_str());
          if (x.empty()) lv_obj_remove_flag(id(nav_b0), LV_OBJ_FLAG_CLICKABLE);
          else lv_obj_add_flag(id(nav_b0), LV_OBJ_FLAG_CLICKABLE);
          // home-page shortcut tile
          lv_label_set_text(id(sc_l0), x.c_str());
          if (x.empty()) lv_obj_add_flag(id(sc_b0), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(sc_b0), LV_OBJ_FLAG_HIDDEN);
  - platform: homeassistant
    id: dp1_labels
    entity_id: ${layout}
    attribute: p1_labels
    on_value:
      - script.execute: sync_dyn
  - platform: homeassistant
    id: dp1_ents
    entity_id: ${layout}
    attribute: p1_entities
    on_value:
      - script.execute: sync_dyn
  - platform: homeassistant
    id: dp1_states
    entity_id: ${layout}
    attribute: p1_states
    on_value:
      - script.execute: sync_dyn
  - platform: homeassistant
    id: dp2_name
    entity_id: ${layout}
    attribute: p2_name
    on_value:
      - lvgl.label.update:
          id: dp2_title
          text: !lambda |-
            std::string s = x.empty() ? std::string("Page 2") : x;
            return s;
      # Bottom bar: blank + not tappable when this page isn't set up in the app
      - lambda: |-
          lv_label_set_text(id(navl_1), x.c_str());
          if (x.empty()) lv_obj_remove_flag(id(nav_b1), LV_OBJ_FLAG_CLICKABLE);
          else lv_obj_add_flag(id(nav_b1), LV_OBJ_FLAG_CLICKABLE);
          // home-page shortcut tile
          lv_label_set_text(id(sc_l1), x.c_str());
          if (x.empty()) lv_obj_add_flag(id(sc_b1), LV_OBJ_FLAG_HIDDEN);
