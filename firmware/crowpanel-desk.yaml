sensor:
  # 3.2.0: seconds before an idle page returns home (desktop app → HA)
  - platform: homeassistant
    id: home_timeout_ha
    entity_id: ${layout}
    attribute: home_timeout
    internal: true
    on_value:
      - lambda: 'if (!std::isnan(x)) id(home_timeout_s) = (int) x;'
      - script.execute: home_timer
  # Volume knob (KY-040) on the UART port. If it turns the wrong way, swap the two pin numbers.
  - platform: rotary_encoder
    id: vol_knob
    name: "Volume knob"
    internal: true
    pin_a: { number: GPIO44, mode: { input: true, pullup: true } }
    pin_b: { number: GPIO43, mode: { input: true, pullup: true } }
    resolution: 1
    on_clockwise:
      - script.execute: { id: knob_turn, step: 2 }
    on_anticlockwise:
      - script.execute: { id: knob_turn, step: -2 }
  - platform: debug
    free:
      name: "Free internal heap"
    block:
      name: "Largest internal block"
    psram:
      name: "Free PSRAM"
  - platform: homeassistant
    id: np_volume
    entity_id: ${now_playing}
    attribute: volume
    on_value:
      - lvgl.slider.update:
          id: vol_slider
          value: !lambda 'return x;'
      - lvgl.label.update:
          id: vol_lbl
          text: !lambda |-
            std::string s = esphome::to_string((int) x) + "%";
            return s;
  - platform: homeassistant
    id: np_position
    entity_id: ${now_playing}
    attribute: position
    on_value:
      - lambda: 'id(np_pos) = x;'
  - platform: homeassistant
    id: np_duration
    entity_id: ${now_playing}
    attribute: duration
    on_value:
      - lambda: 'id(np_dur) = x;'
  - platform: homeassistant
    id: np_position_ts
    entity_id: ${now_playing}
    attribute: pos_ts
    on_value:
      - lambda: 'id(np_ts) = x;'
  - platform: homeassistant
    id: vol_sp1
    entity_id: ${speaker_1}
    attribute: volume_level
    on_value:
      - lvgl.slider.update:
          id: sl_sp1
          value: !lambda 'return x * 100;'
  - platform: homeassistant
    id: vol_sp2
    entity_id: ${speaker_2}
    attribute: volume_level
    on_value:
      - lvgl.slider.update:
          id: sl_sp2
          value: !lambda 'return x * 100;'
  - platform: homeassistant
    id: vol_sp3
    entity_id: ${speaker_4}
    attribute: volume_level
    on_value:
      - lvgl.slider.update:
          id: sl_sp3
          value: !lambda 'return x * 100;'
  - platform: homeassistant
    id: th_current
    entity_id: ${thermostat}
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: th_current_lbl
          text: !lambda |-
            char b[16]; snprintf(b, sizeof(b), "%.1f°", x);
            return std::string(b);
  - platform: homeassistant
    id: th_target
    entity_id: ${thermostat}
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: th_target_lbl
          text: !lambda |-
            char b[24]; snprintf(b, sizeof(b), "Set %.1f°", x);
            return std::string(b);

# Live progress bar (1 s tick; position is extrapolated between HA updates)
interval:
  - interval: 10s
    then:
      - lambda: |-
          uint8_t b = 0;
          id(touch_alive).publish_state(id(touch_i2c)->read(0x5D, &b, 1) == i2c::ERROR_OK);
  # Safety net: repaint the layout pages every 5 s so they can never drift from HA.
  - interval: 5s
    then:
      - script.execute: sync_dyn
  - interval: 1s
    then:
      - lambda: |-
          float pos = id(np_pos);
          if (id(np_state).state == "playing") {
            auto now = id(ha_time).now();
            if (now.is_valid() && id(np_ts) > 0) pos += (float) now.timestamp - id(np_ts);
          }
          if (pos < 0) pos = 0;
          if (id(np_dur) > 0 && pos > id(np_dur)) pos = id(np_dur);
          id(np_now_pos) = pos;
      - if:
          condition:
            lambda: 'return !id(seeking) && id(np_dur) > 0;'
          then:
            - lvgl.slider.update:
                id: prog_slider
                value: !lambda 'return id(np_now_pos) * 1000.0f / id(np_dur);'
      - lvgl.label.update:
          id: elapsed_lbl
          text: !lambda |-
            int p = std::max(0, (int) id(np_now_pos));
            char b[20]; snprintf(b, sizeof(b), "%d:%02d", p / 60, p % 60);
            return std::string(b);
      - lvgl.label.update:
          id: remain_lbl
          text: !lambda |-
            if (id(np_dur) <= 0) return std::string("--:--");
            int r = std::max(0, (int) (id(np_dur) - id(np_now_pos)));
            char b[20]; snprintf(b, sizeof(b), "-%d:%02d", r / 60, r % 60);
            return std::string(b);

# Reusable actions
script:
  # 3.2.0: clock + date on the home page (12-hour)
  - id: clock_update
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          int h = t.hour % 12; if (h == 0) h = 12;
          char buf[16];
          snprintf(buf, sizeof(buf), "%d:%02d", h, t.minute);
          lv_label_set_text(id(home_clock), buf);
          lv_label_set_text(id(home_ampm), t.hour < 12 ? "AM" : "PM");
          lv_obj_align_to(id(home_ampm), id(home_clock), LV_ALIGN_OUT_RIGHT_TOP, 6, 20);
          lv_label_set_text(id(home_date), t.strftime("%A, %B %d").c_str());
  # 3.2.0: go back to the home page after home_timeout_s without a touch.
  # Restarted by every touch, knob turn and page change; Music and Home never time out.
  - id: home_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(home_timeout_s) > 0 && id(cur_nav) != 8 && id(cur_nav) != 4;'
          then:
            - delay: !lambda 'return (uint32_t) id(home_timeout_s) * 1000;'
            - if:
                condition:
                  lambda: 'return id(cur_nav) != 8 && id(cur_nav) != 4;'
                then:
                  - lvgl.page.show: home_page
                  - script.execute: { id: set_nav, idx: 8 }
  # 3.1.1: fetch album art only when needed and only while the screen is on
  - id: art_refresh
    mode: single
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(art_pending) && !id(art_url).empty();'
              - not: lvgl.is_paused
          then:
            - lambda: 'id(art_pending) = false;'
            - online_image.set_url:
                id: album_art
                url: !lambda 'return id(art_url);'
            - component.update: album_art
  # Knob: wake the screen, move the slider right away, send the volume once you stop turning.
  - id: knob_turn
    mode: queued
    max_runs: 20
    parameters:
      step: int
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - script.execute: sync_dyn
            - lvgl.widget.redraw:
            - light.turn_on: backlight
            - script.execute: art_refresh
      - script.execute: home_timer
      - lambda: |-
          lv_display_trigger_activity(nullptr);   // keeps the sleep timer from firing
          if (id(knob_vol) < 0)
            id(knob_vol) = std::isnan(id(np_volume).state) ? 20 : (int) id(np_volume).state;
          id(knob_vol) = std::max(0, std::min(100, id(knob_vol) + step));
      - lvgl.slider.update:
          id: vol_slider
          value: !lambda 'return id(knob_vol);'
      - script.execute: knob_send
      - script.execute: home_timer
  - id: knob_send
    mode: restart
    then:
      - delay: 150ms
      - script.execute:
          id: set_volume
          pct: !lambda 'return id(knob_vol);'
      - delay: 3s
      - lambda: 'id(knob_vol) = -1;'
  # Re-paint pages 1-4 (labels + green/black) from the latest HA layout sensor.
  - id: sync_dyn
    mode: restart
    then:
      - lambda: |-
            { lv_obj_t *const b[] = {id(hf_b0), id(hf_b1), id(hf_b2), id(hf_b3), id(hf_b4), id(hf_b5), id(hf_b6), id(hf_b7)};
              lv_obj_t *const l[] = {id(hf_l0), id(hf_l1), id(hf_l2), id(hf_l3), id(hf_l4), id(hf_l5), id(hf_l6), id(hf_l7)};
              desk_layout::apply_labels(b, l, 8, id(home_labels).state, id(home_ents).state);
              desk_layout::apply_states(b, 8, id(home_states).state);
              lv_obj_t *const hint = id(home_fav_hint);
              if (id(home_ents).state.empty()) lv_obj_remove_flag(hint, LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(hint, LV_OBJ_FLAG_HIDDEN); }
            { lv_obj_t *const b[] = {id(dp1_b0), id(dp1_b1), id(dp1_b2), id(dp1_b3), id(dp1_b4), id(dp1_b5), id(dp1_b6), id(dp1_b7), id(dp1_b8), id(dp1_b9), id(dp1_b10), id(dp1_b11)};
              lv_obj_t *const l[] = {id(dp1_l0), id(dp1_l1), id(dp1_l2), id(dp1_l3), id(dp1_l4), id(dp1_l5), id(dp1_l6), id(dp1_l7), id(dp1_l8), id(dp1_l9), id(dp1_l10), id(dp1_l11)};
              desk_layout::apply_labels(b, l, 12, id(dp1_labels).state, id(dp1_ents).state);
              desk_layout::apply_states(b, 12, id(dp1_states).state); }
            { lv_obj_t *const b[] = {id(dp2_b0), id(dp2_b1), id(dp2_b2), id(dp2_b3), id(dp2_b4), id(dp2_b5), id(dp2_b6), id(dp2_b7), id(dp2_b8), id(dp2_b9), id(dp2_b10), id(dp2_b11)};
              lv_obj_t *const l[] = {id(dp2_l0), id(dp2_l1), id(dp2_l2), id(dp2_l3), id(dp2_l4), id(dp2_l5), id(dp2_l6), id(dp2_l7), id(dp2_l8), id(dp2_l9), id(dp2_l10), id(dp2_l11)};
              desk_layout::apply_labels(b, l, 12, id(dp2_labels).state, id(dp2_ents).state);
              desk_layout::apply_states(b, 12, id(dp2_states).state); }
            { lv_obj_t *const b[] = {id(dp3_b0), id(dp3_b1), id(dp3_b2), id(dp3_b3), id(dp3_b4), id(dp3_b5), id(dp3_b6), id(dp3_b7), id(dp3_b8), id(dp3_b9), id(dp3_b10), id(dp3_b11)};
              lv_obj_t *const l[] = {id(dp3_l0), id(dp3_l1), id(dp3_l2), id(dp3_l3), id(dp3_l4), id(dp3_l5), id(dp3_l6), id(dp3_l7), id(dp3_l8), id(dp3_l9), id(dp3_l10), id(dp3_l11)};
              desk_layout::apply_labels(b, l, 12, id(dp3_labels).state, id(dp3_ents).state);
              desk_layout::apply_states(b, 12, id(dp3_states).state); }
            { lv_obj_t *const b[] = {id(dp4_b0), id(dp4_b1), id(dp4_b2), id(dp4_b3), id(dp4_b4), id(dp4_b5), id(dp4_b6), id(dp4_b7), id(dp4_b8), id(dp4_b9), id(dp4_b10), id(dp4_b11)};
              lv_obj_t *const l[] = {id(dp4_l0), id(dp4_l1), id(dp4_l2), id(dp4_l3), id(dp4_l4), id(dp4_l5), id(dp4_l6), id(dp4_l7), id(dp4_l8), id(dp4_l9), id(dp4_l10), id(dp4_l11)};
              desk_layout::apply_labels(b, l, 12, id(dp4_labels).state, id(dp4_ents).state);
              desk_layout::apply_states(b, 12, id(dp4_states).state); }
  # Light the Spotify / YouTube button that matches the HA source selector
  - id: sync_source
    mode: restart
    then:
      - lvgl.widget.update:
          id: src_sp_btn
          state:
            checked: !lambda 'return id(pl_source).state == "Spotify";'
      - lvgl.widget.update:
          id: src_yt_btn
          state:
            checked: !lambda 'return id(pl_source).state == "YouTube Music";'
  - id: sync_source_later
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: sync_source
  - id: sync_dyn_later
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: sync_dyn
  # Highlight the active bottom-bar button
  - id: set_nav
    parameters:
      idx: int
    then:
      - lambda: |-
          lv_obj_t *const navs[] = {id(nav_b0), id(nav_b1), id(nav_b2), id(nav_b3), id(nav_b4), id(nav_b5), id(nav_b6), id(nav_b7), id(nav_bh)};
          for (int i = 0; i < 9; i++) {
            if (i == idx) lv_obj_add_state(navs[i], LV_STATE_CHECKED);
            else lv_obj_remove_state(navs[i], LV_STATE_CHECKED);
          }
          id(cur_nav) = idx;
          if (idx == 8) lv_obj_add_flag(id(nav), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_remove_flag(id(nav), LV_OBJ_FLAG_HIDDEN);
      - script.execute: home_timer
  - id: ma_action
    parameters:
      svc: string
    then:
      - homeassistant.action:
          action: !lambda 'return svc;'
          data:
            entity_id: !lambda 'return id(np_player).state;'
  - id: set_volume
    parameters:
      pct: int
    then:
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: !lambda 'return id(np_player).state;'
            volume_level: !lambda 'return pct / 100.0f;'
  - id: thermostat_nudge
    parameters:
      delta: float
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${thermostat}
            temperature: !lambda 'return id(th_target).state + delta;'
  - id: thermostat_mode
    parameters:
      mode: string
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: ${thermostat}
            hvac_mode: !lambda 'return mode;'

# ───────────── LVGL UI ─────────────
lvgl:
  displays: [my_display]
  touchscreens: [my_touchscreen]
  buffer_size: 25%
  on_idle:
    timeout: !lambda 'return (uint32_t) (id(screen_timeout).state * 60000);'
    then:
      - lvgl.page.show: home_page
      - script.execute: { id: set_nav, idx: 8 }
      - light.turn_off: backlight
      - lvgl.pause:

  theme:
    label:
      text_color: 0xE8E8E8
    # Off = solid black + outline (dark-grey fills shimmer on this TN panel)
    button:
      bg_color: 0x000000
      radius: 14
      border_width: 2
      border_color: 0x4A4D55
      checked:
        bg_color: 0x1DB954
