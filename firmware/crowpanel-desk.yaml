binary_sensor:
  # 3.1.2 diagnostics: is the touch chip answering right now? (checked every 10 s)
  - platform: template
    id: touch_alive
    name: "Touch chip responding"
    icon: mdi:gesture-tap-button
    entity_category: diagnostic

